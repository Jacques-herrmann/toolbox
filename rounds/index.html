<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rounds</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app" id="setup">
    <header class="top">
      <a href="../" class="icon-btn" aria-label="Retour à la Toolbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="brand"><i></i>ROUNDS</div>
      <button class="icon-btn" id="openSettings" aria-label="Réglages" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </header>

    <section class="panel rise hidden" id="settings">
      <div class="panel-head">
        <h2>Son</h2>
        <button class="ghost-btn" id="testSound">Tester</button>
      </div>
      <div id="settingsRows"></div>
    </section>

    <nav class="modes rise" id="modes" aria-label="Mode"></nav>

    <section class="hero rise" style="animation-delay:.06s">
      <div class="hero-label">Durée totale</div>
      <div class="hero-time" id="total">00:00</div>
      <div class="hero-meta" id="meta"></div>
      <div class="timeline" id="timeline"></div>
      <div class="legend">
        <span style="--c:var(--amber)">Prépa</span>
        <span style="--c:var(--lime)">Effort</span>
        <span style="--c:var(--blue)">Repos</span>
      </div>
    </section>

    <section class="panel rise" id="form" style="animation-delay:.12s"></section>

    <section class="panel rise" style="animation-delay:.18s">
      <div class="panel-head">
        <h2>Presets</h2>
        <button class="ghost-btn" id="savePreset">+ Sauver</button>
      </div>
      <div class="chips" id="presets"></div>
    </section>
  </div>

  <div class="startbar" id="startbar">
    <button class="start" id="start">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
      Démarrer
    </button>
  </div>

  <section id="run" class="hidden" data-phase="prep" aria-live="polite">
    <div class="run-bar"><i id="rBar"></i></div>
    <div class="run-head">
      <div class="run-phase" id="rPhase">Prépa</div>
      <div class="run-round" id="rRound"></div>
    </div>
    <div class="run-clock" id="rClock">00:00</div>
    <div class="dots" id="rDots"></div>
    <div class="run-next"><span id="rNext"></span><span id="rLeft"></span></div>
    <button class="counter hidden" id="rCounter">Rounds faits <b id="rCount">0</b></button>
    <div class="controls">
      <button class="ctl" id="rStop" aria-label="Arrêter">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
      </button>
      <button class="ctl main" id="rPause" aria-label="Pause">
        <svg viewBox="0 0 24 24" fill="currentColor" id="rPauseIcon"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg>
      </button>
      <button class="ctl" id="rSkip" aria-label="Suivant">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5v13a1 1 0 0 0 1.55.83L15 13.6V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v4.4L6.55 4.67A1 1 0 0 0 5 5.5z"/></svg>
      </button>
    </div>
  </section>

  <script src="../shared/pwa.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
