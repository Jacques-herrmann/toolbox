[build]
  publish = "."

# Type MIME correct pour que les PWA soient installables
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Les service workers ne doivent jamais être mis en cache par le navigateur
[[headers]]
  for = "/*sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/shared/sw-factory.js"
  [headers.values]
    Cache-Control = "no-cache"
